# RoundTrip nginx config snippet
# Include this in your existing server block (e.g. LibreNMS)
# Add to your nginx config: include /opt/roundtrip/deploy/nginx.conf;

# RoundTrip API
location /roundtrip/api/ {
    rewrite ^/roundtrip/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# RoundTrip frontend (static files)
location /roundtrip {
    alias /opt/roundtrip/frontend/out;
    try_files $uri $uri.html $uri/ /roundtrip/index.html;
}
